name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and fix sdkmanager
        run: |
          echo "Mencari sdkmanager..."
          find / -name "sdkmanager" 2>/dev/null || echo "sdkmanager tidak ditemukan"
          echo "Mencari cmdline-tools..."
          find / -path "*/cmdline-tools/*/sdkmanager" 2>/dev/null || echo "cmdline-tools tidak ditemukan"

      - name: Install Android build-tools
        run: |
          export ANDROID_HOME=/home/user/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/tools/bin

          SDKMANAGER=$(find / -name "sdkmanager" 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager ditemukan di: $SDKMANAGER"
            yes | $SDKMANAGER --licenses || true
            $SDKMANAGER "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          else
            echo "sdkmanager tidak ditemukan, lanjut ke build..."
          fi

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
