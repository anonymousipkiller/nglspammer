name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: First run - Download Android SDK
        run: |
          buildozer android debug || true
          echo "===== Cek lokasi SDK ====="
          find /github/home /home -type d -name "android-sdk" 2>/dev/null || true

      - name: Force install aidl (cara pasti)
        run: |
          apt-get update
          apt-get install -y aidl libstdc++6
          
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          cp $(which aidl) $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
          chmod +x $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
          
          echo "aidl dipaksa masuk:"
          ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/

      - name: Build APK
        run: |
          buildozer -v android debug

          - name: Install Android SDK platforms
  run: |
    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" || true
    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true

         - name: Build APK
  run: |
    buildozer -v android debug
