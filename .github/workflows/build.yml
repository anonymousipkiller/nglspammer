name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: First run - Download Android SDK
        run: |
          buildozer android debug || true

      - name: Install platforms android-33
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT"
          
          SDKMANAGER=$(find "$HOME" -name sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-33" "platforms;android-34" "build-tools;34.0.0" || true
          
          echo "=== Platforms terinstall ==="
          ls -la "$SDK_ROOT/platforms/" || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
