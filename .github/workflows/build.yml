name: Build APK with Buildozer (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build APK inside Kivy Docker image
        run: |
          docker run --rm \
            -v "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build_output.log

      - name: Extract error tail
        if: always()
        run: tail -n 150 build_output.log > error_tail.txt

      - name: Upload error tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-tail
          path: error_tail.txt

      - name: Upload APK if success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: bin/*.apk
