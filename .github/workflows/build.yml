name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: First run - Download Android SDK (akan gagal, itu normal)
        run: |
          buildozer android debug || true
          echo "===== Cek lokasi SDK ====="
          find /github/home /home -type d -name "android-sdk" 2>/dev/null || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 platform-tools'

      - name: Install build-tools 34.0.0 with correct command
        run: |
          export ANDROID_HOME=/github/home/.buildozer/android/platform/android-sdk
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin"
          
          SDKMANAGER=$(find /github/home /home -name "sdkmanager" 2>/dev/null | head -n 1)
          
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan, install manual..."
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd /tmp
            curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          
          export PATH="$PATH:$(dirname $SDKMANAGER)"
          
          echo "Menggunakan sdkmanager di: $SDKMANAGER"
          
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          mkdir -p $ANDROID_HOME/build-tools
          ln -sfn $ANDROID_HOME/build-tools/34.0.0 $ANDROID_HOME/build-tools/34.0.0
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aidl || true
          
          echo "===== Cek hasil ====="
          ls -la $ANDROID_HOME/build-tools/34.0.0/aidl
          echo ">>> BERHASIL install build-tools 34.0.0"

      - name: Clean & Build final
        run: |
          buildozer android clean || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
