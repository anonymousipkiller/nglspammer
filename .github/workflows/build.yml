name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev build-essential git wget unzip

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install cython buildozer

    - name: Download and install Android SDK command-line tools
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_SDK_ROOT
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT
        mv $ANDROID_SDK_ROOT/cmdline-tools $ANDROID_SDK_ROOT/latest
        export PATH=$PATH:$ANDROID_SDK_ROOT/latest/bin

    - name: Accept SDK licenses
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/latest/bin
        yes | sdkmanager --licenses || true

    - name: Install Build-Tools 30
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/latest/bin
        yes | sdkmanager "build-tools;30.0.3" || true

    - name: Build APK
      run: echo y | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ngl-spammer-apk
        path: bin/*.apk
