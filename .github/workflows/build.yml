name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK with p4a
      run: |
        export P4A_ROOT=/home/user/.local/share/python-for-android
        export ANDROID_SDK_ROOT=/home/user/.buildozer/android/platform/android-sdk
        export ANDROID_NDK_ROOT=/home/user/.buildozer/android/platform/android-ndk-r25b

        p4a apk --private . \
          --package=org.anonymouspickiller.nglspammer \
          --name="NGL Spammer" \
          --version=1.0.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,requests \
          --arch=arm64-v8a \
          --android-api=30 \
          --ndk-version=25b \
          --permission=INTERNET

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ngl-spammer-apk
        path: ./*.apk
