name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: First run - Download Android SDK (will fail on AIDL, that's expected)
        run: |
          buildozer android debug || true
          echo "SDK should be downloaded now..."

      - name: Force install build-tools 34.0.0 + fix AIDL
        run: |
          set -e
          
          export ANDROID_HOME=/home/user/.buildozer/android/platform/android-sdk
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin"
          
          find /home/user/.buildozer -name "sdkmanager" 2>/dev/null || true
          
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          mkdir -p $ANDROID_HOME/build-tools
          ln -sfn $ANDROID_HOME/build-tools/34.0.0 $ANDROID_HOME/build-tools/34.0.0
          
          ls -la $ANDROID_HOME/build-tools/34.0.0/aidl
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aidl
          
          echo ">>> build-tools 34.0.0 + AIDL fixed!"

      - name: Clean & Build again (seharusnya berhasil)
        run: |
          buildozer android clean || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
