name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install missing Android build-tools + AIDL
        run: |
          export ANDROID_HOME=/home/user/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin

          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"

          mkdir -p $ANDROID_HOME/build-tools
          ln -sf $ANDROID_HOME/build-tools/34.0.0 $ANDROID_HOME/build-tools/34.0.0
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aidl || true

      - name: Build APK
        run: |
          buildozer android clean || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
