- name: Install all dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      openjdk-17-jdk \
      autoconf \
      automake \
      libtool \
      libtool-bin \
      m4 \
      pkg-config \
      zlib1g-dev \
      build-essential \
      git \
      wget \
      unzip \
      libffi-dev \
      libssl-dev \
      libsqlite3-dev \
      libreadline-dev
    
    # Reinstall and initialize autotools properly
    sudo apt-get install -y --reinstall autoconf automake libtool
    
    # Initialize libtool macros
    sudo libtoolize --install --copy --force || libtoolize --install --copy --force
    
    # Verify installation
    libtoolize --version
    autoconf --version
    automake --version
